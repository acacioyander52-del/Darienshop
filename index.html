<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Darienshop | Atendimento Direct</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 35px 25px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .logo {
      font-size: 1.8em;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 20px;
      color: #ffffff;
    }
    .badge {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      font-size: 0.85em;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 50px;
      display: inline-block;
      margin-bottom: 20px;
      border: 1px solid rgba(96, 165, 250, 0.3);
    }
    h1 {
      font-size: 1.4em;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 15px;
      color: #f1f5f9;
    }
    p {
      font-size: 0.95em;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .btn-whatsapp {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: #25d366;
      color: #ffffff;
      text-decoration: none;
      font-size: 1.05em;
      font-weight: 700;
      padding: 16px;
      border-radius: 12px;
      width: 100%;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.25);
      transition: transform 0.2s, background-color 0.2s;
    }
    .btn-whatsapp:active {
      transform: scale(0.98);
    }
    .info {
      margin-top: 25px;
      font-size: 0.8em;
      color: #64748b;
      display: flex;
      justify-content: center;
      gap: 15px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">Darienshop porto velho</div>
    
    <span class="badge">Atendimento Rápido</span>
    
    <h1>Procurando nossas ofertas e catálogo de produtos?</h1>
    
    <p>
      Atendemos diretamente pelo WhatsApp para tirar suas dúvidas, enviar fotos dos itens disponíveis e negociar os melhores valores.
    </p>

    <a href="#" class="btn-whatsapp" onclick="enviarMensagem()">
      Falar no WhatsApp
    </a>

    <div class="info">
      <span>✓ Atendimento humano</span>
      <span>•</span>
      <span>✓ Entrega em toda porto velho</span>
    </div>
  </div>

  <script>
    function enviarMensagem() {
      const numeroWhatsapp = "5569984560482";
      const mensagem = "Olá! Vim pelo site e gostaria de conhecer os produtos e valores disponíveis.";
      const url = `https://wa.me/${numeroWhatsapp}?text=${encodeURIComponent(mensagem)}`;
      window.open(url, '_blank');
    }
  </script>

</body>
</html>
