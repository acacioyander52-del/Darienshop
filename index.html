<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NorteTech Express | Loja Virtual Porto Velho</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding-bottom: 90px;
    }

    header {
      background-color: #1e293b;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header .logo h1 {
      color: #ffffff;
      font-size: 1.5rem;
    }

    header .logo p {
      color: #94a3b8;
      font-size: 0.8rem;
    }

    /* Banner de Frete */
    .banner-frete {
      background: linear-gradient(90deg, #1e293b, #0f172a);
      border-bottom: 1px solid #334155;
      padding: 10px 15px;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 0.88rem;
    }

    .btn-frete-info {
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.8rem;
      transition: background-color 0.2s;
    }

    .btn-frete-info:hover {
      background-color: #0284c7;
      color: white;
    }

    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 15px;
    }

    /* Campo de Busca */
    .busca-container {
      margin-bottom: 20px;
    }

    .busca-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #1e293b;
      color: white;
      font-size: 0.95rem;
    }

    .busca-input:focus {
      outline: none;
      border-color: #38bdf8;
    }

    .produtos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card-produto {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card-produto:hover {
      transform: translateY(-3px);
      border-color: #38bdf8;
    }

    .card-produto img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .card-produto h3 {
      font-size: 1.1rem;
      margin-bottom: 5px;
    }

    .card-produto .preco {
      color: #38bdf8;
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .btn {
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      margin-bottom: 5px;
      transition: opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-detalhes {
      background-color: #334155;
      color: #38bdf8;
      border: 1px solid #38bdf8;
    }

    .btn-carrinho {
      background-color: #3b82f6;
      color: white;
    }

    .btn-zap-direto {
      background-color: #25d366;
      color: white;
    }

    .btn-comprar {
      background-color: #22c55e;
      color: white;
      padding: 12px 25px;
      font-size: 1rem;
    }

    .btn-fechar {
      background-color: #ef4444;
      color: white;
    }

    /* Barra Fixa do Carrinho no Rodapé */
    .carrinho-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #1e293b;
      border-top: 1px solid #334155;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 -5px 15px rgba(0,0,0,0.4);
      z-index: 90;
    }

    .carrinho-info {
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .carrinho-badge {
      background: #ef4444;
      color: white;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .carrinho-info span.total {
      color: #38bdf8;
      font-weight: bold;
      font-size: 1.1rem;
    }

    /* Modais */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 15px;
    }

    .modal-content {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      max-width: 480px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
    }

    .btn-close-x {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.5rem;
      cursor: pointer;
    }

    /* Lista Detalhada do Carrinho */
    .carrinho-lista-itens {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 15px;
    }

    .item-carrinho {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
    }

      width: 50px;
      height: 5
