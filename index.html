<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Darienshop | Loja Virtual</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding-bottom: 80px;
    }

    header {
      background-color: #1e293b;
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #334155;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      color: #ffffff;
      font-size: 1.8rem;
    }

    header p {
      color: #94a3b8;
      font-size: 0.9rem;
    }

    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .produtos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card-produto {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-produto img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .card-produto h3 {
      font-size: 1.1rem;
      margin-bottom: 5px;
    }

    .card-produto .preco {
      color: #38bdf8;
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .btn {
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      margin-bottom: 5px;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-carrinho {
      background-color: #3b82f6;
      color: white;
    }

    .btn-zap-direto {
      background-color: #25d366;
      color: white;
    }

    /* Barra Fixa do Carrinho no Rodapé */
    .carrinho-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #1e293b;
      border-top: 1px solid #334155;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 -5px 15px rgba(0,0,0,0.3);
    }

    .carrinho-info {
      font-size: 1.1rem;
    }

    .carrinho-info span {
      color: #38bdf8;
      font-weight: bold;
    }

    .btn-comprar {
      background-color: #22c55e;
      color: white;
      padding: 12px 25px;
      border-radius: 8px;
      font-size: 1rem;
      width: auto;
    }

    /* Modal de Checkout */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 200;
    }

    .modal-content {
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
      max-width: 450px;
      width: 90%;
    }

    .modal-content h2 {
      margin-bottom: 15px;
    }

    .modal-content input, .modal-content select {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
    }

    .pix-box {
      background: #0f172a;
      padding: 15px;
      border-radius: 8px;
      border: 1px dashed #38bdf8;
      text-align: center;
      margin-bottom: 15px;
      display: none;
    }

    .pix-box code {
      word-break: break-all;
      color: #38bdf8;
      font-size: 0.9rem;
    }

    .btn-fechar {
      background-color: #ef4444;
      color: white;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Darienshop Porto Velho</h1>
    <p>Produtos com os melhores preços da região</p>
  </header>

  <div class="container">
    <div class="produtos-grid" id="lista-produtos">
      <!-- Produtos serão inseridos via JavaScript -->
    </div>
  </div>

  <!-- Barra de Carrinho Fixa -->
  <div class="carrinho-bar">
    <div class="carrinho-info">
      Itens: <span id="qtd-itens">0</span> | Total: <span id="total-valor">R$ 0,00</span>
    </div>
    <button class="btn btn-comprar" onclick="abrirCheckout()">Finalizar Compra</button>
  </div>

  <!-- Modal de Checkout -->
  <div class="modal" id="modal-checkout">
    <div class="modal-content">
      <h2>Finalizar Pedido</h2>
      
      <input type="text" id="nome-cliente" placeholder="Seu Nome Completo">
      <input type="text" id="endereco-cliente" placeholder="Endereço de Entrega em Porto Velho">
      
      <label for="metodo-pagamento">Forma de Pagamento:</label>
      <select id="metodo-pagamento" onchange="alternarPagamento()">
        <option value="whatsapp">Negociar / Enviar Pedido no WhatsApp</option>
        <option value="pix">Pagar no Site via PIX</option>
      </select>

      <!-- Caixa de Pagamento PIX -->
      <div class="pix-box" id="caixa-pix">
        <p><strong>Chave PIX (Celular):</strong></p>
        <code>69984560482</code>
        <p style="font-size: 0.8rem; color: #94a3b8; margin-top: 8px;">Após realizar a transferência, clique em "Confirmar Pedido".</p>
      </div>

      <button class="btn btn-comprar" onclick="processarPedido()">Confirmar Pedido</button>
      <button class="btn btn-fechar" onclick="fecharCheckout()">Cancelar</button>
    </div>
  </div>

  <script>
    // 1. Seu Catálogo de Produtos
    const produtos = [
      { id: 1, nome: "fone lenovo LE253", preco: 69.98, img: "https://http2.mlstatic.com/D_NQ_NP_2X_806647-MLB116310732088_092026-F-fone-de-ouvido-lenovo-tws-le253.webp" },
      { id: 2, nome: "fone bluetooth M1O", preco: 19.99, img: "https://http2.mlstatic.com/D_NQ_NP_2X_772036-MLB95085370087_102025-F-fone-de-ouvido-m10-bluetooth-v51-c-carregador-power-bank.webp" },
      { id: 3, nome: "lanterna 3 em 1", preco: 19.98, img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQEyCVPFl9vPXJFJnj8VKtsS3id5rCBgBz1Y9VbhD-BwSHXDk5lXJb6tGIv&s=10" },
      { id: 4, nome: "meia de compressão", preco: 24.99, img: "https://encrypted-tbn0.gstatic.com/shopping?q=tbn:ANd9GcSkNOjwdMKcSIJrD7jZ6jbqIrQW33oDKznkIwenoHZ8qm3qbUmtGZgiX8wwq6i0mGMUDFORGkDMkovEP-ZMIZeJn00X9FtZWs30Pa_rsWbpodFfh-sDun_u9tA8Z-IRJ0uLtGK_Zg&usqp=CAc" }
    ];

    let carrinho = [];

    // 2. Renderizar os produtos na tela
    function carregarProdutos() {
      const container = document.getElementById("lista-produtos");
      container.innerHTML = "";

      produtos.forEach(prod => {
        container.innerHTML += `
          <div class="card-produto">
            <div>
              <img src="${prod.img}" alt="${prod.nome}">
              <h3>${prod.nome}</h3>
              <p class="preco">R$ ${prod.preco.toFixed(2).replace('.', ',')}</p>
            </div>
            <div>
              <button class="btn btn-carrinho" onclick="adicionarAoCarrinho(${prod.id})">+ Adicionar ao Carrinho</button>
              <button class="btn btn-zap-direto" onclick="comprarDiretoZap('${prod.nome}', ${prod.preco})">Chamar no WhatsApp</button>
            </div>
          </div>
        `;
      });
    }

    // 3. Adicionar produto ao carrinho
    function adicionarAoCarrinho(id) {
      const prod = produtos.find(p => p.id === id);
      carrinho.push(prod);
      atualizarCarrinho();
    }

    function atualizarCarrinho() {
      document.getElementById("qtd-itens").innerText = carrinho.length;
      const total = carrinho.reduce((acc, item) => acc + item.preco, 0);
      document.getElementById("total-valor").innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
    }

    // 4. Comprar item individual pelo WhatsApp
    function comprarDiretoZap(nome, preco) {
      const zap = "5569984560482";
      const texto = `Olá! Gostaria de saber mais sobre o produto: *${nome}* (R$ ${preco.toFixed(2)})`;
      window.open(`https://wa.me/${zap}?text=${encodeURIComponent(texto)}`, '_blank');
    }

    // 5. Funções do Modal de Checkout
    function abrirCheckout() {
      if (carrinho.length === 0) {
        alert("Seu carrinho está vazio! Adicione algum produto antes.");
        return;
      }
      document.getElementById("modal-checkout").style.display = "flex";
    }

    function fecharCheckout() {
      document.getElementById("modal-checkout").style.display = "none";
    }

    function alternarPagamento() {
      const metodo = document.getElementById("metodo-pagamento").value;
      const caixaPix = document.getElementById("caixa-pix");
      caixaPix.style.display = (metodo === "pix") ? "block" : "none";
    }

    // 6. Enviar Pedido Final
    function processarPedido() {
      const nome = document.getElementById("nome-client").value;
      const endereco = document.getElementById("endereco-cliente").value;
      const metodo = document.getElementById("metodo-pagamento").value;

      if (!nome || !endereco) {
        alert("Por favor, preencha seu nome e endereço de entrega!");
        return;
      }

      const total = carrinho.reduce((acc, item) => acc + item.preco, 0);
      const listaItens = carrinho.map(i => `- ${i.nome} (R$ ${i.preco.toFixed(2)})`).join('\n');
      
      const zap = "5569984560482";
      let mensagem = `*NOVO PEDIDO DO SITE*\n\n`;
      mensagem += `*Cliente:* ${nome}\n`;
      mensagem += `*Endereço:* ${endereco}\n\n`;
      mensagem += `*Itens do Pedido:*\n${listaItens}\n\n`;
      mensagem += `*Total:* R$ ${total.toFixed(2)}\n`;
      mensagem += `*Forma de Pagamento:* ${metodo === 'pix' ? 'PIX Realizado no Site' : 'A combinar / WhatsApp'}`;

      window.open(`https://wa.me/${zap}?text=${encodeURIComponent(mensagem)}`, '_blank');
      
      // Limpa carrinho e fecha modal
      carrinho = [];
      atualizarCarrinho();
      fecharCheckout();
    }

    // Inicializar loja
    carregarProdutos();
  </script>
</body>
</html>
